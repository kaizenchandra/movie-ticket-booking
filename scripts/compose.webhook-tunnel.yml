# Development only. Run alongside docker-compose.yml; no host ports are opened.
services:
  webhook-proxy:
    image: python:3.12-alpine
    command: [ "python", "/app/webhook_proxy.py" ]
    volumes:
      - ./scripts/webhook_proxy.py:/app/webhook_proxy.py:ro
    networks:
      - app-network
  webhook-tunnel:
    image: cloudflare/cloudflared:latest
    command: [ "tunnel", "--no-autoupdate", "--url", "http://webhook-proxy:8091" ]
    depends_on:
      - webhook-proxy
    networks:
      - app-network
