server:
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        name: AUTH_SESSION
        same-site: lax
        secure: false
  port: 9000
logging:
  level:
    org.springframework.security: INFO

auth:
  access-ttl: 15m
  refresh-ttl: 7d
  demo-enabled: ${AUTH_DEMO_ENABLED:true}
spring:
  task:
    scheduling:
      pool:
        size: 3
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${SMTP_STARTTLS:false}
      "[mail.smtp.starttls.required]": ${SMTP_STARTTLS:false}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mtb}
    username: ${SPRING_DATASOURCE_USERNAME:kaizen}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
  flyway:
    enabled: true
    schemas: auth
    default-schema: auth
    locations: classpath:db/auth-migration
  security:
    oauth2:
      authorizationserver:
        issuer: http://localhost:9000
        client:
          oidc-client:
            registration:
              client-id: oidc-client
              client-secret: "{noop}secret"
              client-authentication-methods:
                - client_secret_basic
              authorization-grant-types:
                - authorization_code
                - refresh_token
              redirect-uris:
                - http://127.0.0.1:8080/login/oauth2/code/oidc-client
                - http://localhost:8080/login/oauth2/code/oidc-client
              post-logout-redirect-uris:
                - http://127.0.0.1:8080/
                - http://localhost:8080/
              scopes:
                - openid
                - profile
                - email
                - read
                - write
            require-authorization-consent: true

