<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta content="width=device-width,initial-scale=1" name="viewport">
<meta content="no-referrer" name="referrer">
<title>Verify your email</title>
<style>body {
    font: 18px system-ui;
    max-width: 36rem;
    margin: 4rem auto;
    padding: 1rem
}

input, button {
    font: inherit;
    padding: .6rem;
    margin: .5rem 0
}

label {
    display: block
}</style>
<h1>Verify your email</h1>
<form id="form"><p>Confirm that this is your email address.</p>
    <button id="submit">Verify your email</button>
</form>
<p id="status" role="status"></p>
<noscript>Enable JavaScript to submit this secure form.</noscript>
<script>
    const token = new URLSearchParams(location.hash.slice(1)).get('token');
    history.replaceState(null, '', location.pathname);
    const status = document.getElementById('status'), button = document.getElementById('submit');
    if (!token) {
        status.textContent = 'This link is incomplete. Request a new email.';
        button.disabled = true
    }
    document.getElementById('form').onsubmit = async event => {
        event.preventDefault();
        button.disabled = true;
        try {
            const data = {token};
            const response = await fetch('/api/v1/auth/verify-email', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            if (!response.ok) {
                const error = await response.json();
                throw Error(error.detail || 'Unable to complete request')
            }
            document.getElementById('form').reset();
            status.textContent = 'Email verified. You can now sign in.';
        } catch (error) {
            status.textContent = error.message;
            button.disabled = false
        }
    };
</script>
</html>
