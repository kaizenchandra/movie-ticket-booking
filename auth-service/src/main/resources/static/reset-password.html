<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta content="width=device-width,initial-scale=1" name="viewport">
<meta content="no-referrer" name="referrer">
<title>Reset your password</title>
<style>body {
    font: 18px system-ui;
    max-width: 36rem;
    margin: 4rem auto;
    padding: 1rem
}

input, button {
    font: inherit;
    padding: .6rem;
    margin: .5rem 0
}

label {
    display: block
}</style>
<h1>Reset your password</h1>
<form id="form"><label>New password <input autocomplete="new-password" id="password" maxlength="72" minlength="12"
                                           required type="password"></label><label>Confirm password <input
        autocomplete="new-password" id="confirm" required type="password"></label>
    <button id="submit">Reset your password</button>
</form>
<p id="status" role="status"></p>
<noscript>Enable JavaScript to submit this secure form.</noscript>
<script>
    const token = new URLSearchParams(location.hash.slice(1)).get('token');
    history.replaceState(null, '', location.pathname);
    const status = document.getElementById('status'), button = document.getElementById('submit');
    if (!token) {
        status.textContent = 'This link is incomplete. Request a new email.';
        button.disabled = true
    }
    document.getElementById('form').onsubmit = async event => {
        event.preventDefault();
        button.disabled = true;
        try {
            const data = {token};
            const password = document.getElementById('password').value;
            if (password !== document.getElementById('confirm').value) throw Error('Passwords do not match');
            data.newPassword = password;
            const response = await fetch('/api/v1/auth/reset-password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            if (!response.ok) {
                const error = await response.json();
                throw Error(error.detail || 'Unable to complete request')
            }
            document.getElementById('form').reset();
            status.textContent = 'Password changed. Sign in with your new password.';
        } catch (error) {
            status.textContent = error.message;
            button.disabled = false
        }
    };
</script>
</html>
